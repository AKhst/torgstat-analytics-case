name: 'jaffle_shop'
version: '1.0.0'
config-version: 2

# Это имя профиля, которое dbt ищет в ~/.dbt/profiles.yml
profile: 'jaffle_shop'

# Папки, где лежит код
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Настройки материализации (как сохранять таблицы)
models:
  jaffle_shop:
    # По умолчанию всё сохраняем как view (виртуальные таблицы)
    +materialized: view
    
    # А вот здесь мы настроим staging, КОГДА создадим эту папку
    # staging:
    #   +materialized: view