name: 'torgstat_dbt'
version: '1.0.0'
config-version: 2

profile: 'torgstat_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  torgstat_dbt:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: "{{ env_var('STAGING_SCHEMA', 'staging') }}"
      +tags: ['staging']
    marts:
      +materialized: table
      +schema: "{{ env_var('MARTS_SCHEMA', 'marts') }}"
      +tags: ['marts']
      +post-hook: "{{ grant_select_to_readonly() }}"
