version: 2

sources:
  - name: raw_data
    description: Validated B2B SaaS CSV extracts loaded with immutable batch metadata.
    database: "{{ env_var('POSTGRES_DB', 'torgdb') }}"
    schema: "{{ env_var('RAW_SCHEMA', 'raw') }}"
    config:
      loaded_at_field: _loaded_at_utc
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 168, period: hour}
    tables:
      - name: workspaces
        description: Current workspace records and billing defaults.
        columns:
          - {name: workspace_id, data_tests: [not_null, unique]}
          - {name: billing_currency, data_tests: [not_null]}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: plans
        description: Product plan reference data with monthly and annual prices.
        columns:
          - {name: plan_id, data_tests: [not_null, unique]}
          - {name: plan_name, data_tests: [not_null]}
          - {name: tier_rank, data_tests: [not_null, unique]}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: users
        description: Current users assigned to one workspace.
        columns:
          - {name: user_id, data_tests: [not_null, unique]}
          - name: workspace_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'workspaces')", field: workspace_id}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: sessions
        description: User sessions with first-touch attribution.
        columns:
          - {name: session_id, data_tests: [not_null, unique]}
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'users')", field: user_id}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: subscriptions
        description: Stable subscription lifecycles owned by workspaces.
        columns:
          - {name: subscription_id, data_tests: [not_null, unique]}
          - name: workspace_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'workspaces')", field: workspace_id}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: subscription_plan_history
        description: Non-overlapping plan periods for subscriptions.
        columns:
          - {name: subscription_plan_period_id, data_tests: [not_null, unique]}
          - name: subscription_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'subscriptions')", field: subscription_id}
          - name: plan_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'plans')", field: plan_id}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: invoices
        description: Immutable billing snapshots with controlled quality defects.
        columns:
          - {name: invoice_id, data_tests: [not_null, unique]}
          - name: subscription_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'subscriptions')", field: subscription_id}
          - name: workspace_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'workspaces')", field: workspace_id}
          - name: plan_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'plans')", field: plan_id}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: events
        description: Product events recorded at workspace grain without a source event ID.
        columns:
          - name: workspace_id
            data_tests:
              - not_null
              - relationships:
                  arguments: {to: "source('raw_data', 'workspaces')", field: workspace_id}
          - {name: event_date, data_tests: [not_null]}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}

      - name: fx_rates
        description: Daily currency rates used for USD reporting.
        data_tests:
          - unique_combination_of_columns:
              arguments: {combination_of_columns: [rate_date, base_currency, quote_currency]}
        columns:
          - {name: rate_date, data_tests: [not_null]}
          - {name: base_currency, data_tests: [not_null]}
          - {name: quote_currency, data_tests: [not_null]}
          - {name: rate, data_tests: [not_null]}
          - {name: _load_batch_id, data_tests: [not_null]}
          - {name: _loaded_at_utc, data_tests: [not_null]}
