version: 2

models:
  - name: stg_workspaces
    description: Typed workspace records with billing defaults and source lineage.
    config: {contract: {enforced: true}}
    columns:
      - {name: workspace_key, data_type: text, data_tests: [not_null, unique]}
      - {name: workspace_id, data_type: text, data_tests: [not_null, unique]}
      - {name: workspace_name, data_type: text, data_tests: [not_null]}
      - {name: created_at, data_type: date, data_tests: [not_null]}
      - {name: country_code, data_type: text, data_tests: [not_null]}
      - name: customer_segment
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [smb, mid_market, enterprise]}
      - name: billing_currency
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [EUR, GBP, USD]}
      - {name: is_active, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_plans
    description: Typed product plans with pricing quality flags.
    config: {contract: {enforced: true}}
    columns:
      - {name: plan_key, data_type: text, data_tests: [not_null, unique]}
      - {name: plan_id, data_type: integer, data_tests: [not_null, unique]}
      - {name: plan_name, data_type: text, data_tests: [not_null, unique]}
      - {name: tier_rank, data_type: integer, data_tests: [not_null, unique]}
      - {name: monthly_price, data_type: "numeric(14,2)", data_tests: [not_null]}
      - {name: annual_price, data_type: "numeric(14,2)", data_tests: [not_null]}
      - {name: is_active, data_type: boolean, data_tests: [not_null]}
      - {name: has_negative_price, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_annual_price, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_users
    description: Current users with lifecycle, role, consent, and timestamp quality flags.
    config: {contract: {enforced: true}}
    columns:
      - {name: user_key, data_type: text, data_tests: [not_null, unique]}
      - {name: user_id, data_type: bigint, data_tests: [not_null, unique]}
      - name: workspace_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_workspaces')", field: workspace_id}
      - {name: created_at, data_type: "timestamp without time zone"}
      - {name: country_code, data_type: text}
      - name: user_role
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [owner, admin, member, analyst]}
      - name: signup_type
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [self_service, invited]}
      - {name: has_gdpr_consent, data_type: boolean, data_tests: [not_null]}
      - {name: is_active, data_type: boolean, data_tests: [not_null]}
      - {name: deleted_at, data_type: "timestamp without time zone"}
      - {name: is_missing_created_at, data_type: boolean, data_tests: [not_null]}
      - {name: is_invalid_created_at, data_type: boolean, data_tests: [not_null]}
      - {name: is_missing_country, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_lifecycle, data_type: boolean, data_tests: [not_null]}
      - {name: created_at_raw, data_type: text}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_sessions
    description: User sessions with normalized first-touch attribution.
    config: {contract: {enforced: true}}
    columns:
      - {name: session_key, data_type: text, data_tests: [not_null, unique]}
      - {name: session_id, data_type: text, data_tests: [not_null, unique]}
      - name: user_id
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_users')", field: user_id}
      - {name: started_at, data_type: "timestamp without time zone", data_tests: [not_null]}
      - {name: utm_source, data_type: text}
      - {name: utm_medium, data_type: text}
      - {name: is_first_session, data_type: boolean, data_tests: [not_null]}
      - {name: is_missing_first_touch_source, data_type: boolean, data_tests: [not_null]}
      - {name: has_utm_on_non_first_session, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_subscriptions
    description: Stable subscription lifecycles independent of plan changes.
    config: {contract: {enforced: true}}
    columns:
      - {name: subscription_key, data_type: text, data_tests: [not_null, unique]}
      - {name: subscription_id, data_type: bigint, data_tests: [not_null, unique]}
      - name: workspace_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_workspaces')", field: workspace_id}
      - {name: started_at, data_type: date, data_tests: [not_null]}
      - {name: ended_at, data_type: date}
      - name: subscription_status
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [trial, active, past_due, cancelled]}
      - {name: has_invalid_period, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_lifecycle, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_subscription_plan_history
    description: Non-overlapping plan and billing-frequency periods.
    config: {contract: {enforced: true}}
    columns:
      - {name: subscription_plan_period_key, data_type: text, data_tests: [not_null, unique]}
      - name: subscription_key
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_subscriptions')", field: subscription_key}
      - {name: subscription_plan_period_id, data_type: bigint, data_tests: [not_null, unique]}
      - {name: subscription_id, data_type: bigint, data_tests: [not_null]}
      - name: plan_id
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_plans')", field: plan_id}
      - name: billing_frequency
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [monthly, annual]}
      - {name: valid_from, data_type: date, data_tests: [not_null]}
      - {name: valid_to, data_type: date}
      - name: change_type
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [initial, upgrade, downgrade]}
      - {name: has_invalid_period, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_invoices
    description: Immutable billing snapshots with accounting and lifecycle controls.
    config: {contract: {enforced: true}}
    columns:
      - {name: invoice_key, data_type: text, data_tests: [not_null, unique]}
      - name: subscription_key
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_subscriptions')", field: subscription_key}
      - {name: invoice_id, data_type: bigint, data_tests: [not_null, unique]}
      - {name: subscription_id, data_type: bigint, data_tests: [not_null]}
      - name: workspace_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_workspaces')", field: workspace_id}
      - {name: plan_id, data_type: integer, data_tests: [not_null]}
      - name: billing_frequency
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [monthly, annual]}
      - {name: issued_at, data_type: date, data_tests: [not_null]}
      - {name: due_at, data_type: date, data_tests: [not_null]}
      - {name: period_start, data_type: date, data_tests: [not_null]}
      - {name: period_end, data_type: date, data_tests: [not_null]}
      - {name: source_currency_code, data_type: text}
      - {name: net_amount, data_type: "numeric(14,2)", data_tests: [not_null]}
      - {name: tax_amount, data_type: "numeric(14,2)", data_tests: [not_null]}
      - {name: gross_amount, data_type: "numeric(14,2)", data_tests: [not_null]}
      - name: payment_status
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [pending, paid, failed]}
      - {name: paid_at, data_type: date}
      - {name: amount_reconciliation_difference, data_type: "numeric(14,2)", data_tests: [not_null]}
      - {name: is_missing_currency, data_type: boolean, data_tests: [not_null]}
      - {name: has_negative_amount, data_type: boolean, data_tests: [not_null]}
      - {name: has_amount_reconciliation_mismatch, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_billing_period, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_due_date, data_type: boolean, data_tests: [not_null]}
      - {name: has_invalid_payment_lifecycle, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_events
    description: Workspace product events with occurrence keys and duplicate flags.
    config: {contract: {enforced: true}}
    columns:
      - {name: event_key, data_type: text, data_tests: [not_null, unique]}
      - name: workspace_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_workspaces')", field: workspace_id}
      - {name: event_date, data_type: date, data_tests: [not_null]}
      - name: event_name
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [dashboard_viewed, export_limit_reached, login]}
      - {name: event_properties_json, data_type: text}
      - {name: event_occurrence_number, data_type: bigint, data_tests: [not_null]}
      - {name: event_record_count, data_type: bigint, data_tests: [not_null]}
      - {name: is_duplicate_event_payload, data_type: boolean, data_tests: [not_null]}
      - {name: is_missing_event_properties, data_type: boolean, data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}

  - name: stg_fx_rates
    description: Typed historical FX rates.
    config: {contract: {enforced: true}}
    data_tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [rate_date, base_currency, quote_currency]}
    columns:
      - {name: fx_rate_key, data_type: text, data_tests: [not_null, unique]}
      - {name: rate_date, data_type: date, data_tests: [not_null]}
      - {name: base_currency, data_type: text, data_tests: [not_null]}
      - {name: quote_currency, data_type: text, data_tests: [not_null]}
      - {name: rate, data_type: "numeric(14,6)", data_tests: [not_null]}
      - {name: source_file_name, data_type: text, data_tests: [not_null]}
      - {name: source_row_number, data_type: bigint, data_tests: [not_null]}
      - {name: load_batch_id, data_type: text, data_tests: [not_null]}
      - {name: loaded_at_utc, data_type: "timestamp with time zone", data_tests: [not_null]}
